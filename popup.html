<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Crunchyroll AutoSkip Pro</h1>

    <button id="mainToggle" class="main-btn">
      Disable Auto-Skip
    </button>

    <div class="section">
      <label class="switch">
        <input type="checkbox" id="pip">
        <span class="slider"></span>
      </label>
      <span>Show Picture-in-Picture</span>
    </div>

    <div class="section">
      <label class="switch">
        <input type="checkbox" id="skipIntro">
        <span class="slider"></span>
      </label>
      <span>Skip Intro</span>
    </div>

    <div class="section">
      <label class="switch">
        <input type="checkbox" id="skipCredits">
        <span class="slider"></span>
      </label>
      <span>Skip Credits</span>
    </div>

    <div class="section">
      <label class="switch">
        <input type="checkbox" id="debug">
        <span class="slider"></span>
      </label>
      <span>Debug Mode</span>
    </div>

	<div class="credit">
	  ⚡ Coded by 
	  <a href="https://www.facebook.com/yashvirgaming.info" target="_blank" rel="noopener">
		Yashvir Gaming
	  </a>
	</div>

    <div class="footer">
      v1.1 • Alt+Shift+S
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
